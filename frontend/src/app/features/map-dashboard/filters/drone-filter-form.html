<section class="filters" aria-labelledby="filters-heading">
  <h2 id="filters-heading">Filters</h2>

  <form [formGroup]="form" (ngSubmit)="applyFilters()">
    <div class="field">
      <label for="filter-drone-type">Drone type</label>
      <input id="filter-drone-type" type="text" formControlName="droneType" placeholder="e.g. Quadcopter" />
    </div>

    <div class="field">
      <label for="filter-status">Status</label>
      <select id="filter-status" formControlName="status">
        <option [ngValue]="null">Any</option>
        <option value="active">Active</option>
        <option value="landed">Landed</option>
        <option value="lost_signal">Lost signal</option>
      </select>
    </div>

    <div class="field">
      <label for="filter-operator-id">Operator ID</label>
      <input id="filter-operator-id" type="text" formControlName="operatorId" placeholder="e.g. OP-123" />
    </div>

    <div class="field">
      <label for="filter-min-battery">Minimum battery (%)</label>
      <input id="filter-min-battery" type="number" min="0" max="100" formControlName="minBattery" />
    </div>

    <div class="field">
      <label for="filter-from">From date</label>
      <input id="filter-from" type="date" formControlName="from" />
    </div>

    <div class="field">
      <label for="filter-to">To date</label>
      <input id="filter-to" type="date" formControlName="to" />
    </div>

    <div class="actions">
      <button type="submit">Apply Filters</button>
      <button type="button" (click)="clearFilters()">Clear Filters</button>
    </div>
  </form>
</section>
