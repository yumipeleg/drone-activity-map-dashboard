# For now this only defines PostgreSQL. `backend`, `worker` (Celery),
# `redis`, and `frontend` services are expected to be added later as
# additional entries under `services`, without needing to redesign this
# file — they will just join the default network and depend on `db`.

services:
  db:
    image: postgres:16-alpine
    container_name: drone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drone_password}
      POSTGRES_DB: ${POSTGRES_DB:-drone_activity}
    ports:
      - "5432:5432"
    volumes:
      - drone_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drone_user} -d ${POSTGRES_DB:-drone_activity}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  drone_pg_data:
