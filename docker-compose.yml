# Full stack: PostgreSQL, Redis (Celery broker), FastAPI backend, Celery worker,
# and Angular frontend. Run: docker compose up --build
#
# Browser: http://localhost:4200  |  API: http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    container_name: drone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drone_password}
      POSTGRES_DB: ${POSTGRES_DB:-drone_activity}
    ports:
      - "5432:5432"
    volumes:
      - drone_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drone_user} -d ${POSTGRES_DB:-drone_activity}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-drone_user}:${POSTGRES_PASSWORD:-drone_password}@db:5432/${POSTGRES_DB:-drone_activity}
      CELERY_BROKER_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: '["http://localhost:4200"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-drone_user}:${POSTGRES_PASSWORD:-drone_password}@db:5432/${POSTGRES_DB:-drone_activity}
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  drone_pg_data:
